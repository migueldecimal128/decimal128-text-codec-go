name: ci

# The codec is one package with no dependencies outside the standard library, so
# CI exists to cover what a developer's host does not: the other OS, the race
# detector, and the build with the internal assertions armed — which is the only
# configuration in which a verify can fail at all.
#
# The conformance vectors come from decimal128-resources, mounted as a submodule
# at <repo>/resources, so every checkout needs `submodules: recursive` — without
# it the tests fail loudly naming the fix rather than silently skipping the
# corpus. The full 84,783-row canonical table comes with it and runs everywhere.

on:
  push:
  pull_request:

jobs:
  test:
    name: go on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no dependencies, no go.sum — nothing to cache

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Test (assertions armed)
        run: go test -tags verify ./...
